<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bayraq qalxır</title>
<style>
:root{--ink:#f6efe4;--panel:rgba(12,14,26,.78);--line:rgba(255,255,255,.2);--acc:#ffc46b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0d1020;color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top,0px));text-shadow:0 1px 8px rgba(0,0,0,.6);max-width:60vw}
#big{font:700 34px/1.1 Georgia,serif}#sub{opacity:.85}
#bar{width:min(240px,50vw);height:5px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:8px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--acc)}
button,textarea,input{font:inherit;color:var(--ink)}
button{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;margin:2px 2px 2px 0}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#tg{position:fixed;right:16px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--panel)}
#pn{position:fixed;right:12px;top:calc(54px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 24px));max-height:calc(100% - 100px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;backdrop-filter:blur(8px)}
#pn[hidden]{display:none}
label{display:block;font-size:12px;opacity:.8;margin:8px 0 3px}
textarea{width:100%;height:84px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;padding:6px;font-family:Consolas,monospace;font-size:12px}
input[type=number]{width:90px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;padding:4px}
#msg{color:#ff9a8f;min-height:18px;font-size:12px}
input[type=file]{width:100%;font-size:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;padding:6px}
pre{margin:6px 0 0;font:11px/1.4 Consolas,monospace;white-space:pre-wrap;opacity:.9}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><div id="big">0 / 1000</div><div id="sub">Hədiyyə gözlənilir. Bayraq yerində durur.</div><div id="bar"><i></i></div></div>
<button id="tg" aria-expanded="false">Panel</button>
<aside id="pn" hidden>
 <label for="rl">Bayraq hədiyyə kodları — hər sətir: ID (bir neçə ID vergüllə) | ad | vahid | bayraq | endir (ixtiyari). Bayraqlar: az, ge, ru, ua, il.</label>
 <textarea id="rl" spellcheck="false"></textarea>
 <button id="ap">Tətbiq et</button><div id="msg"></div>
 <label for="bgFile">Arxa fon şəkli</label><input id="bgFile" type="file" accept="image/*"><button id="bgClear">Şəkli sil — standart rəngə qayıt</button>
 <label>Simulyasiya (eyni normallaşdırıcı və qayda yolu ilə)</label><div id="qs"></div>
 <label for="wd">Külək gücü</label><input type="range" id="wd" min="0" max="100" value="55" style="width:100%">
 <label for="gl">Zirvə üçün lazım olan vahid</label><input type="number" id="gl" value="1000" min="1">
 <div><button id="rs">Bayrağı endir (yenidən başlat)</button></div>
 <pre id="lg">Hələ hadisə yoxdur.</pre>
</aside>

<script>
/* ===== L2M CORE: no flag, no canvas, no TikTok ===== */
const L2M=(()=>{
const nid=v=>v==null?undefined:(String(v).trim().replace(/^#/,'')||undefined),nn=n=>(n==null?'':String(n).trim().toLowerCase())||undefined;
const LIM={min:1,max:100,gifts:50},uid=()=>Math.random().toString(36).slice(2,9),streaks=new Map();
function normalize(r,src){const id=nid(r.giftId),named=!!(r.giftName&&String(r.giftName).trim());return{source:src||'simulator',eventId:r.eventId,user:r.user,giftId:id,giftName:named?String(r.giftName).trim():(id?'#'+id:undefined),named,repeat:r.repeat,repeatCount:r.repeatCount,repeatEnd:r.repeatEnd,groupId:r.groupId}}
function conflicts(rules){const m=new Map(),o=[];for(const r of rules.filter(r=>r.enabled!==false))for(const a of[...(r.match.giftIds||[]).map(i=>'id:'+nid(i)),...(r.match.giftNames||[]).map(n=>'name:'+nn(n))]){const p=m.get(a);if(p&&p.target!==r.target)o.push(a);else if(!p)m.set(a,r)}return o}
function match(ev,rules){const L=rules.filter(r=>r.enabled!==false);const r=ev.giftId&&L.find(r=>(r.match.giftIds||[]).some(i=>nid(i)===ev.giftId));if(r)return r;const n=ev.named?nn(ev.giftName):0;return n?L.find(r=>(r.match.giftNames||[]).some(x=>nn(x)===n)):undefined}
function delta(e){const k=[e.user||'',e.giftId||e.giftName||'',e.groupId||''].join('|');let d;if(e.repeat!==undefined)d=Number(e.repeat);else if(e.repeatCount!==undefined){const c=Number(e.repeatCount);if(!Number.isFinite(c))return NaN;const p=streaks.get(k)||0;d=Math.max(0,c-p);if(!e.repeatEnd)streaks.set(k,Math.max(c,p))}else d=1;if(e.repeatEnd)streaks.delete(k);return d}
async function process(raw,rules,output,src){
 const event=normalize(raw,src),rec={event,rule:null,command:null,output:null,status:''},fin=s=>{rec.status=s;return rec};
 const rule=match(event,rules);if(!rule){rec.output={note:'unmapped',id:event.giftId,name:event.giftName};return fin('unmapped')}
 rec.rule=rule;if(!(rule.unitsPerGift>=LIM.min&&rule.unitsPerGift<=LIM.max)){rec.output={error:'Units per gift out of range'};return fin('rejected')}
 let n=delta(event);if(!Number.isFinite(n)||n<0){rec.output={error:'Invalid gift count'};return fin('rejected')}
 if(n===0){rec.output={note:'no new gifts'};return fin('no-new-gifts')}
 n=Math.min(Math.floor(n),LIM.gifts);
 rec.command={commandId:'cmd-'+uid(),target:rule.target,action:rule.action||'move',amount:rule.unitsPerGift*n,unit:rule.unit,repeatCount:n,source:event.source,eventId:event.eventId,giftId:event.giftId,giftName:event.giftName,user:event.user,createdAt:new Date().toISOString()};
 try{await output.execute(rec.command);rec.output={ok:true};return fin('executed')}catch(e){rec.output={ok:false,error:String(e.message||e)};return fin('output-failed')}}
return{process,conflicts}})();

/* ===== PRODUCT LAYER: flag state (units only change via L2M commands) ===== */
const game={flags:[],goal:1000,rules:[],log:[]};
const FlagOutput={execute(cmd){const f=game.flags.find(x=>x.target===cmd.target);if(!f)throw new Error('Unknown target '+cmd.target);f.targetValue=cmd.action==='lower'?Math.max(0,f.targetValue-cmd.amount):Math.min(game.goal,f.targetValue+cmd.amount)}};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const countryMeta=[['az','AZƏRBAYCAN','flag-az'],['ge','GÜRCÜSTAN','flag-ge'],['ru','RUSİYA','flag-ru'],['ua','UKRAYNA','flag-ua'],['il','İSRAİL','flag-il']];
game.flags=countryMeta.map(([code,name,target])=>({code,name,target,targetValue:0,shown:0,vel:0,texture:null}));
function parseRules(txt){const rules=[];for(const line of txt.split('\n').map(s=>s.trim()).filter(Boolean)){const[idText,name,u,country,mode]=line.split('|').map(s=>s.trim());const ids=(idText||'').split(',').map(s=>s.trim()).filter(Boolean),n=Number(u),meta=countryMeta.find(x=>x[0]===country.toLowerCase());if(!ids.length||ids.some(id=>!/^\d+$/.test(id))||!(n>=1)||!meta)throw new Error('Yanlış sətir — ID (vergüllə ayrıla bilər) | ad | vahid | az/ge/ru/ua/il: '+line);rules.push({id:'r'+country+ids.join('-'),match:{giftIds:ids,giftNames:name?[name]:[]},target:meta[2],action:/^(endir|lower)$/i.test(mode||'')?'lower':'raise',unitsPerGift:n,unit:'vahid'})}if(rules.length!==5||new Set(rules.map(r=>r.target)).size!==5)throw new Error('Hər bayraq üçün ayrıca bir hədiyyə sətri yazın (cəmi 5).');return rules}
function applyRules(){try{const r=parseRules($('rl').value);const c=L2M.conflicts(r);if(c.length)throw new Error('Eyni hədiyyə kodu iki bayrağa verilib: '+c.join(', '));game.rules=r;$('msg').textContent='5 bayraq üçün hədiyyələr tətbiq edildi.';quick()}catch(e){$('msg').textContent=e.message}}
function quick(){$('qs').innerHTML=game.rules.map((r,i)=>{const f=game.flags.find(x=>x.target===r.target);return`<button data-i="${i}" data-n="1">${f.name}: ${esc(r.match.giftNames[0]||'#'+r.match.giftIds[0])} ×1</button><button data-i="${i}" data-n="5">×5</button>`}).join('')+'<button data-i="-1">Naməlum hədiyyə</button>'}
async function push(raw,src){const rec=await L2M.process(raw,game.rules,FlagOutput,src);game.log.unshift(rec);game.log.length=Math.min(game.log.length,6);
 $('lg').textContent=game.log.map(r=>`${r.status}: ${r.event.giftName||'?'}${r.command?' → '+(game.flags.find(f=>f.target===r.command.target)?.name||'')+' +'+r.command.amount+' '+r.command.unit:''}${r.output&&r.output.error?' ('+r.output.error+')':''}`).join('\n')}
window.L2M_push=raw=>push(raw,'tiktok-live'); // hook for an optional TikTok adapter / bridge
$('qs').onclick=e=>{const d=e.target.dataset;if(d.i===undefined)return;const r=game.rules[d.i];push(r?{giftId:r.match.giftIds[0],giftName:r.match.giftNames[0],user:'sim',repeat:Number(d.n)}:{giftId:999999,giftName:'Mystery',user:'sim',repeat:1})};
$('ap').onclick=applyRules;$('tg').onclick=()=>{const p=$('pn');p.hidden=!p.hidden;$('tg').setAttribute('aria-expanded',!p.hidden)};
$('gl').onchange=()=>{game.goal=Math.max(1,Number($('gl').value)||1000);game.flags.forEach(f=>{f.targetValue=Math.min(f.targetValue,game.goal);f.shown=Math.min(f.shown,game.goal)})};
$('rs').onclick=()=>game.flags.forEach(f=>f.targetValue=0);
 $('rl').value='5655 | Rose | 1 | az\n5269 | TikTok | 1 | ge\n11434 | Flame Heart GDM | 1 | ru\n6064 | GG | 1 | ua\n6093 | Football | 1 | il';applyRules();
$('bgFile').onchange=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{if(backgroundPhoto&&backgroundPhoto.src.startsWith('blob:'))URL.revokeObjectURL(backgroundPhoto.src);backgroundPhoto=img;buildBg()};img.onerror=()=>{$('msg').textContent='Şəkil açıla bilmədi.';URL.revokeObjectURL(url)};img.src=url};
$('bgClear').onclick=()=>{if(backgroundPhoto&&backgroundPhoto.src.startsWith('blob:'))URL.revokeObjectURL(backgroundPhoto.src);backgroundPhoto=null;$('bgFile').value='';buildBg()};

/* ===== RENDERING & PHYSICS ===== */
const cv=$('cv'),ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
let w,h,gy,pt,poleH,fh,fw,px,dx,dy,hz,bg,cloudSprites=[];const C=18,R=10,N=C*R;
const X=new Float32Array(N),Y=new Float32Array(N),Z=new Float32Array(N),OX=new Float32Array(N),OY=new Float32Array(N),OZ=new Float32Array(N),NM=new Float32Array(N*3);let cons=[];
const rng=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
const tex=document.createElement('canvas');tex.width=600;tex.height=300;
(function(){const c=tex.getContext('2d');['#00b5e2','#ef3340','#509e2f'].forEach((col,i)=>{c.fillStyle=col;c.fillRect(0,i*100,600,100)});
 c.fillStyle='#fff';c.beginPath();c.arc(283,150,38,0,7);c.fill();c.fillStyle='#ef3340';c.beginPath();c.arc(298,150,31,0,7);c.fill();
 c.fillStyle='#fff';c.beginPath();for(let k=0;k<16;k++){const a=k*Math.PI/8-Math.PI/2,r=k%2?9:21;c.lineTo(352+Math.cos(a)*r,150+Math.sin(a)*r)}c.fill();
 for(let y=0;y<300;y+=2){c.fillStyle='rgba(0,0,0,.05)';c.fillRect(0,y,600,1)}for(let x=0;x<600;x+=2){c.fillStyle='rgba(255,255,255,.04)';c.fillRect(x,0,1,300)}})();
// The four added standards use the same cloth mesh and wind response as Azerbaijan.
function makeFlagTexture(country){const t=document.createElement('canvas');t.width=600;t.height=300;const c=t.getContext('2d');
 if(country==='georgia'){c.fillStyle='#fff';c.fillRect(0,0,600,300);c.fillStyle='#ef3340';c.fillRect(265,0,70,300);c.fillRect(0,115,600,70);for(const [x,y]of[[135,70],[465,70],[135,230],[465,230]]){c.fillRect(x-8,y-28,16,56);c.fillRect(x-28,y-8,56,16)}}
 if(country==='russia'){['#fff','#2454a6','#d52b1e'].forEach((v,i)=>{c.fillStyle=v;c.fillRect(0,i*100,600,100)})}
 if(country==='ukraine'){c.fillStyle='#0057b7';c.fillRect(0,0,600,150);c.fillStyle='#ffd700';c.fillRect(0,150,600,150)}
 if(country==='israel'){c.fillStyle='#fff';c.fillRect(0,0,600,300);c.fillStyle='#0038b8';c.fillRect(0,35,600,32);c.fillRect(0,233,600,32);c.strokeStyle='#0038b8';c.lineWidth=10;for(const rotation of[-Math.PI/2,Math.PI/2]){c.beginPath();for(let i=0;i<3;i++){const a=rotation+i*Math.PI*2/3,x=300+Math.cos(a)*50,y=150+Math.sin(a)*50;i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath();c.stroke()}}
 // Small woven highlights retain the same cloth finish on every flag.
 for(let y=1;y<300;y+=3){c.fillStyle='rgba(0,0,0,.045)';c.fillRect(0,y,600,1)}return t}
const extraFlags=[{name:'GÜRCÜSTAN',tex:makeFlagTexture('georgia')},{name:'RUSİYA',tex:makeFlagTexture('russia')},{name:'UKRAYNA',tex:makeFlagTexture('ukraine')},{name:'İSRAİL',tex:makeFlagTexture('israel')}];
game.flags.forEach((f,i)=>f.texture=i===0?tex:extraFlags[i-1].tex);
const flagTop=u=>{const a=gy-poleH*.06-fh,b=pt+poleH*.035;return a+(b-a)*Math.min(1,u/game.goal)};
function flame(c,x,b,wd,ht){c.beginPath();c.moveTo(x,b);c.lineTo(x,b-ht*.72);c.bezierCurveTo(x,b-ht*.9,x+wd*.15,b-ht*.97,x+wd*.2,b-ht);c.bezierCurveTo(x+wd*.75,b-ht*.85,x+wd,b-ht*.62,x+wd,b-ht*.5);c.lineTo(x+wd,b);c.closePath()}
function hazeFx(c,a){c.save();c.globalCompositeOperation='source-atop';const g=c.createLinearGradient(0,hz-h*.45,0,hz);g.addColorStop(0,'rgba(233,164,122,0)');g.addColorStop(1,`rgba(233,164,122,${a})`);c.fillStyle=g;c.fillRect(0,0,w,hz);c.restore()}
let backgroundPhoto=null;
function buildBg(){
 bg=document.createElement('canvas');bg.width=w*dpr;bg.height=h*dpr;const c=bg.getContext('2d');c.scale(dpr,dpr);hz=h*.6;const r=rng(7);
 c.fillStyle='#202a36';c.fillRect(0,0,w,h);
 if(backgroundPhoto){const iw=backgroundPhoto.width,ih=backgroundPhoto.height,scale=Math.max(w/iw,h/ih),dw=iw*scale,dh=ih*scale;c.drawImage(backgroundPhoto,(w-dw)/2,(h-dh)/2,dw,dh);return}
 return;
 let g=c.createLinearGradient(0,0,0,hz);[[0,'#1f3463'],[.35,'#5d5a8f'],[.62,'#d9856f'],[.85,'#f5b676'],[1,'#ffd9a0']].forEach(s=>g.addColorStop(s[0],s[1]));c.fillStyle=g;c.fillRect(0,0,w,hz+2);
 const sx=w*.62;g=c.createRadialGradient(sx,hz-h*.015,0,sx,hz-h*.015,h*.5);g.addColorStop(0,'rgba(255,225,160,.95)');g.addColorStop(.12,'rgba(255,190,110,.55)');g.addColorStop(1,'rgba(255,150,90,0)');c.fillStyle=g;c.fillRect(0,0,w,hz);
 c.fillStyle='#fff3d6';c.beginPath();c.arc(sx,hz-h*.015,h*.022,0,7);c.fill();
 for(let i=0;i<34;i++){const cx=r()*w,cy=r()*hz*.55,rx=60+r()*220,ry=2+r()*5;c.fillStyle=`rgba(255,${190+r()*40|0},${160+r()*40|0},${.04+r()*.07})`;c.beginPath();c.ellipse(cx,cy,rx,ry,-.05+r()*.1,0,7);c.fill()}
 c.save();c.globalCompositeOperation='lighter';for(let i=0;i<14;i++){const a=-Math.PI/2+(i-7)*.17+(r()-.5)*.08,L=h*1.1,sp=.025+r()*.03,gr=c.createLinearGradient(sx,hz,sx+Math.cos(a)*L,hz+Math.sin(a)*L);gr.addColorStop(0,'rgba(255,200,130,.16)');gr.addColorStop(1,'rgba(255,200,130,0)');c.fillStyle=gr;c.beginPath();c.moveTo(sx,hz-h*.015);c.lineTo(sx+Math.cos(a-sp)*L,hz+Math.sin(a-sp)*L);c.lineTo(sx+Math.cos(a+sp)*L,hz+Math.sin(a+sp)*L);c.fill()}c.restore();
 g=c.createLinearGradient(0,hz,0,gy);[[0,'#f0b078'],[.25,'#9a7a8a'],[.7,'#33456b'],[1,'#1d2a47']].forEach(s=>g.addColorStop(s[0],s[1]));c.fillStyle=g;c.fillRect(0,hz,w,gy-hz);
 // skyline layers
 const sk=document.createElement('canvas');sk.width=w*dpr;sk.height=h*dpr;const s=sk.getContext('2d');s.scale(dpr,dpr);
 s.fillStyle='#8a7088';for(let x=0;x<w;x+=h*.012){const bh=h*(.015+r()*.05);s.fillRect(x,hz-bh,h*.012,bh)}hazeFx(s,.55);
 s.fillStyle='#4d435c';for(let x=0;x<w;x+=h*.02){const bh=h*(.025+r()*.07);s.fillRect(x,hz-bh,h*.018,bh)}hazeFx(s,.35);
 s.fillStyle='rgba(255,205,120,.55)';for(let i=0;i<260;i++)s.fillRect(r()*w,hz-r()*h*.08,1.4,1.8);
 s.fillStyle='#2f2a3c';s.beginPath();s.moveTo(w*.06,hz);s.bezierCurveTo(w*.09,hz-h*.12,w*.13,hz-h*.1,w*.16,hz-h*.05);s.bezierCurveTo(w*.19,hz-h*.095,w*.23,hz-h*.09,w*.27,hz-h*.02);s.lineTo(w*.27,hz);s.fill(); // Heydar Aliyev Center
 const ox=w*.46,os=h*.05;s.fillStyle='#2f2a3c';s.fillRect(ox-w*.12,hz-h*.035,w*.2,h*.035); // Old City wall
 for(let x=ox-w*.12;x<ox+w*.08;x+=h*.014)s.fillRect(x,hz-h*.043,h*.008,h*.01);
 s.beginPath();s.moveTo(ox-.5*os,hz);s.lineTo(ox-.4*os,hz-1.5*os);s.lineTo(ox-.3*os,hz-1.65*os);s.lineTo(ox+.3*os,hz-1.65*os);s.lineTo(ox+.4*os,hz-1.5*os);s.lineTo(ox+.5*os,hz);s.fill();
 s.fillRect(ox-.33*os,hz-1.85*os,.66*os,.2*os);s.beginPath();s.moveTo(ox-.28*os,hz-1.85*os);s.lineTo(ox,hz-2.12*os);s.lineTo(ox+.28*os,hz-1.85*os);s.fill();s.fillRect(ox+.35*os,hz-1.1*os,.25*os,1.1*os); // Maiden Tower
 {const wx=w*.555,wr=h*.052,wy=hz-wr-h*.012;s.strokeStyle='#2f2a3c';s.fillStyle='#2f2a3c';s.lineWidth=2;s.beginPath();s.arc(wx,wy,wr,0,7);s.stroke();s.beginPath();s.arc(wx,wy,wr*.55,0,7);s.stroke();s.lineWidth=1;for(let k=0;k<12;k++){const a=k*Math.PI/6;s.beginPath();s.moveTo(wx,wy);s.lineTo(wx+Math.cos(a)*wr,wy+Math.sin(a)*wr);s.stroke();s.beginPath();s.arc(wx+Math.cos(a)*wr,wy+Math.sin(a)*wr,2.4,0,7);s.fill()}s.lineWidth=2.5;s.beginPath();s.moveTo(wx-wr*.5,hz);s.lineTo(wx,wy);s.lineTo(wx+wr*.5,hz);s.stroke()}
 hazeFx(s,.25);
 s.fillStyle='#17141f';const fx=w*.74,fwd=w*.03;[[0,.3],[1.1,.36],[2.2,.31]].forEach(([o,k])=>{const x=fx+o*fwd,ht=h*k*1.0;flame(s,x,hz,fwd,ht);s.fill();
  s.save();flame(s,x,hz,fwd,ht);s.clip();let gg=s.createLinearGradient(0,hz-ht,0,hz-ht*.35);gg.addColorStop(0,'rgba(255,110,50,.75)');gg.addColorStop(1,'rgba(255,110,50,0)');s.fillStyle=gg;s.fillRect(x,hz-ht,fwd,ht);
